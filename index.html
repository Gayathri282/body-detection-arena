<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Arena</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="app" class="setup-mode">
  <header>
    <div class="brand">MOTION ARENA</div>
    <div id="status" class="status">CAMERA STARTING</div>
  </header>

  <main>
    <section id="setup" class="screen active">
      <div class="setup-card">
        <div class="eyebrow">CAMERA CALIBRATION</div>
        <h1>Stand inside the play area.</h1>
        <p>Ensure your head, torso, and feet are visible in the camera preview below.</p>
        
        <div class="preview-box">
          <div class="video-holder" id="setupVideoHolder">
            <!-- Video & canvas will move here dynamically or sit in camera-container -->
          </div>
          <div id="setupOverlayBadge" class="overlay-badge">INITIALIZING CAMERA...</div>
        </div>

        <div id="setupMessage" class="setup-message">Starting camera feed...</div>
        <button id="startBtn" class="primary-btn">START GAME</button>
      </div>
    </section>

    <section id="game" class="screen">
      <div class="readout">
        <div class="label">ACTION</div>
        <div id="action" class="value">IDLE</div>
        <div class="label position-label">POSITION</div>
        <div id="position" class="value">CENTER</div>
      </div>
      <div class="confidence" id="confidence">DETECTION: WAITING</div>
      
      <div class="game-video-holder" id="gameVideoHolder">
        <!-- Floating PIP container for game mode -->
      </div>

      <div id="boundaryWarning" class="warning hidden">MOVE INTO THE PLAY AREA</div>
      <button id="recalibrate" class="secondary">RECALIBRATE</button>
    </section>
  </main>

  <!-- Global Shared Video Stream Container -->
  <div id="cameraContainer" class="camera-container setup-view">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
